# Weekly: one issue per maintained language with what its maintainer still has
# to review. Runs on main, needs no build and no approval, takes seconds on Linux.
name: Translation review

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show what the issues would say
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: l10n-review
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0               # blame and the review markers need history
          persist-credentials: false
      - name: Update the tracking issues
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: bash Tools/l10n-review.sh

